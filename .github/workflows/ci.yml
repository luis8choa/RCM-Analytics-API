name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rcm_user
          POSTGRES_PASSWORD: rcm_password_dev
          POSTGRES_DB: rcm_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        env:
          POSTGRES_USER: rcm_user
          POSTGRES_PASSWORD: rcm_password_dev
          POSTGRES_DB: rcm_analytics_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: ci-secret-key-not-for-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          APP_ENV: testing
          APP_PORT: 8000
        run: uv run pytest -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/