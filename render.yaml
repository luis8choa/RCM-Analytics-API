services:
  - type: web
    name: rcm-analytics-api
    runtime: python
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: SECRET_KEY
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: rcm-analytics-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: rcm-analytics-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: rcm-analytics-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: rcm-analytics-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: rcm-analytics-db
          property: database

databases:
  - name: rcm-analytics-db
    databaseName: rcm_analytics
    plan: free